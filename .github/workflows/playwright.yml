name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-dockerized:
    name: Run Dockerized Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Run Playwright Container
        run: |
          docker build -t vortice-playwright-e2e .
          docker run --rm vortice-playwright-e2e

      - name: Archive Playwright test artifacts (en caso de fallo en contenedor)
        if: failure()
        run: |
          docker create --name test-container vortice-playwright-e2e || true
          docker cp test-container:/app/playwright-report ./playwright-report || true
          docker cp test-container:/app/test-results ./test-results || true
          docker rm test-container || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
